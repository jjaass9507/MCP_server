services:
  mcp-server:
    build:
      context: .
      args:
        MCP_EXTRAS: ${MCP_EXTRAS:-}
    image: mcp-server:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # config.toml must exist at this host path before running.
      # Copy from config.toml.example and edit it.
      - ./config.toml:/config/config.toml:ro
      # Persistent data directory for SQLite databases and files.
      - mcp-data:/data
      # Local PowerPoint files exposed read-only inside the container.
      # Override PRESENTATIONS_DIR in .env when decks live elsewhere.
      - ${PRESENTATIONS_DIR:-./presentations}:/presentations:ro
    environment:
      MCP_LOG_LEVEL: INFO
      # Required because the container binds beyond localhost. Set this in a
      # local .env file or the shell before `docker compose up`.
      MCP_HTTP_BEARER_TOKEN: ${MCP_HTTP_BEARER_TOKEN:?set MCP_HTTP_BEARER_TOKEN}
      # Uncomment to write logs to a file inside the container:
      # MCP_LOG_FILE: /data/mcp_server.log

volumes:
  mcp-data:
